name: LaRA engineering
on:
  push:
    branches: [main1, codex/integrate-lara-personality]
    paths: ['lara/**', 'lib/oof-llm/**', 'tests/lara/**', 'tools/*lara*', 'data/knowledge/**', 'data/localization/**', 'render.yaml', 'package.json', '.github/workflows/lara.yml']
  pull_request:
    branches: [main1]
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node tools/check_lara.cjs
      - run: node tools/build_lara_language_inventory.cjs && git diff --exit-code data/localization/lara-language-inventory.json
      - run: node --test tests/lara/*.test.js
      - run: node tests/lara/memory-smoke.cjs memory-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lara-memory-evidence
          path: memory-smoke.json
