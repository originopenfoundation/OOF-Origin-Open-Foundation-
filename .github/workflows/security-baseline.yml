name: Security baseline

on:
  push:
    branches: [main1]
  pull_request:
    branches: [main1]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate repository security baseline
        run: python tools/validate_security_baseline.py

      - name: Run LaRA security tests
        run: node --test tests/lara/security.test.js tests/lara/origin.test.js

      - name: Check repository diff formatting
        run: git diff --check HEAD^ HEAD
