name: OOF AI Incident Daily Sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai-incidents.txt
      - name: Install incident sync dependencies
        run: pip install -r requirements-ai-incidents.txt
      - name: Build Architecture Index registry
        run: |
          python tools/build_architecture_registry.py
          python tools/build_knowledge_infrastructure.py
      - name: Synchronize configured incident sources
        run: python tools/ai_incidents.py sync
      - name: Validate incident records
        run: |
          python tools/incident_intelligence_v2.py build
          python tools/incident_intelligence_v2.py validate
          python tools/audit_ai_incident_methodology.py
          python tools/ai_incidents.py export
          python tools/ai_incidents.py validate
          python tools/audit_ai_incident_v341.py
          python -m unittest tests.test_ai_incidents
      - name: Rebuild public incident pages and discovery metadata
        run: |
          python tools/build_ai_compatibility.py
          python tools/build_ai_incident_pages.py
          python tools/build_url_governance.py
          python tools/build_knowledge_infrastructure.py
          python tools/validate_ai_compatibility.py --allow-visible-changes
          python tools/validate_url_governance.py
          python tools/validate_knowledge_infrastructure.py
      - name: Commit changed public projections
        run: |
          if git diff --quiet -- data/ai-incidents ai-incidents data/knowledge docs/AI_INCIDENT_V3_4_1_PRODUCTION_REMEDIATION_AUDIT.md sitemap.xml search-index.json data/oof-site-knowledge-graph.json; then
            echo "No incident data changes."
            exit 0
          fi
          git config user.name "OOF Incident Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/ai-incidents ai-incidents docs/AI_INCIDENT_V3_4_1_PRODUCTION_REMEDIATION_AUDIT.md sitemap.xml search-index.json llms.txt llms-full.txt
          git add data/oof-site-knowledge-graph.json data/oof-typed-relationships.json
          git add data/oof-url-registry.json data/oof-url-governance-audit.json
          git add data/knowledge
          git commit -m "Update OOF AI incident public data"
          git push
          python tools/build_knowledge_infrastructure.py
          python tools/validate_knowledge_infrastructure.py
          if git diff --quiet -- data/knowledge; then
            exit 0
          fi
          git add data/knowledge
          git commit -m "Refresh OOF knowledge provenance"
          git push
