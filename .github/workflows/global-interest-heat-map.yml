name: Governance Space Map

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-interest-heat-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect analytics configuration
        id: analytics
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          SITE_TAG: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
        run: |
          if [ -n "$ACCOUNT_ID" ] && [ -n "$API_TOKEN" ] && [ -n "$SITE_TAG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare analytics secrets are not configured; preserving the last valid public dataset."
          fi

      - name: Build next public dataset
        if: steps.analytics.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
        run: python tools/update_global_interest_heat_map.py --internal-output "$RUNNER_TEMP/oof-global-interest-internal.json"

      - name: Validate active public dataset
        run: python tools/validate_global_interest_heat_map.py

      - name: Run classification tests
        run: python -m unittest tests.test_global_interest_heat_map

      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        run: npx playwright test --config=playwright.config.mjs

      - name: Preserve internal aggregate snapshot
        if: steps.analytics.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: global-interest-internal-${{ github.run_id }}
          path: ${{ runner.temp }}/oof-global-interest-internal.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish changed public dataset atomically
        if: steps.analytics.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/oof-global-interest-heat-map.json; then
            echo "No public classification change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oof-global-interest-heat-map.json
          git commit -m "Update Governance Space Map"
          git push origin HEAD:main1

      - name: Report refresh failure
        if: failure()
        run: echo "::error title=Governance Space Map refresh failed::The last valid public dataset was preserved. Review this workflow run."
