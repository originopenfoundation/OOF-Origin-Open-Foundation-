name: AI compatibility

on:
  push:
    branches: [main1]
  pull_request:
    branches: [main1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild AI discovery files
        run: |
          python tools/build_localization.py
          python tools/build_ai_compatibility.py

      - name: Rebuild URL and version governance files
        run: python tools/build_url_governance.py

      - name: Rebuild architecture and knowledge registries
        run: |
          python tools/build_architecture_registry.py
          python tools/build_knowledge_infrastructure.py

      - name: Validate AI compatibility
        run: python tools/validate_ai_compatibility.py

      - name: Audit links and discovery structure
        run: python tools/audit_discovery_infrastructure.py --strict

      - name: Validate URL and version governance
        run: python tools/validate_url_governance.py

      - name: Validate knowledge infrastructure
        run: python tools/validate_knowledge_infrastructure.py

      - name: Validate automated incident intelligence
        run: python tools/incident_intelligence_v2.py validate

      - name: Run knowledge retrieval tests
        run: python -m unittest tests.test_knowledge_infrastructure

      - name: Validate localized access pages
        run: python -m unittest tests.test_localization

      - name: Verify generated files are current
        run: git diff --exit-code
